[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashvault"
version = "0.1.0"
description = "AI supply-chain security scanner for model artifacts"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "pyyaml>=6.0,<7",
    "rapidfuzz>=3,<4",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.23,<2"]
dev = [
    "pytest>=8,<10",
    "numpy>=1.26,<3",
    "safetensors>=0.4,<1",
]

[project.scripts]
hashvault = "hashvault.cli:app"

[tool.setuptools.packages.find]
include = ["hashvault*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: large-file tests, run with HASHVAULT_SLOW=1"]
