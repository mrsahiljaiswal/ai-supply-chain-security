name: strict
intake:
  limits:
    max_total_bytes: 4294967296        # 4 GiB
    max_file_count: 10000
    max_archive_depth: 5
    max_compression_ratio: 100         # per member / stream, uncompressed:compressed
    compression_ratio_min_bytes: 1048576  # ratio only enforced above 1 MiB of output
    max_safetensors_header_bytes: 104857600  # 100 MiB
    max_path_bytes: 4096
    max_config_bytes: 67108864         # 64 MiB, config/tokenizer JSON read cap
  severities:
    format_mismatch: warning
    unknown_format: warning
    archive_member_rejected: critical
    local_special_file: warning
    type_mismatch: warning
static:
  severities:
    pickle_dangerous_callable: critical
    pickle_unknown_global: warning
    safetensors_structure: critical
    safetensors_trailing_bytes: critical
    npy_object_dtype: critical
    custom_code_present: warning
provenance:
  severities:
    provenance_hash_match: critical
    provenance_base_claim: warning
    provenance_config: warning
    provenance_typosquat: warning
    provenance_publisher: warning
    provenance_hub_metadata: warning
    provenance_attestation: info
verdict:
  # status=error on a listed check is Undetermined (rule_check_error).
  # Static weight checks count only when that check ran. provenance_hash_match
  # counts only when a registry entry exists. A skip for no_known_good_reference,
  # offline, no_attestation, publisher_not_claimed, or adapter_has_no_model_config
  # is a coverage gap, not a required-check error.
  required_checks:
    - pickle_opcode_scan
    - pickle_dangerous_callable
    - pickle_unknown_global
    - safetensors_structure
    - safetensors_trailing_bytes
    - npy_object_dtype
    - weight_coverage
    - provenance_hash_match
